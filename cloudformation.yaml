AWSTemplateFormatVersion: "2010-09-09"
Description: Simple EC2 deployment for FastAPI app (PoC with automated install)

Resources:
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16

  Subnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.1.0/24
      MapPublicIpOnLaunch: true
      AvailabilityZone: !Select [0, !GetAZs ""]

  InternetGateway:
    Type: AWS::EC2::InternetGateway

  AttachGateway:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  RouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC

  Route:
    Type: AWS::EC2::Route
    DependsOn: AttachGateway
    Properties:
      RouteTableId: !Ref RouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  SubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref Subnet
      RouteTableId: !Ref RouteTable

  EC2SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow HTTP from anywhere
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0

  EC2Instance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: t2.micro
      KeyName: EC2CloudAppDeployment
      ImageId: ami-01ff9fc7721895c6b  # Amazon Linux 2023
      SubnetId: !Ref Subnet
      SecurityGroupIds:
        - !Ref EC2SecurityGroup
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          exec > /var/log/user-data.log 2>&1
          set -xe

          # Install Python and Git
          dnf update -y
          dnf install -y python3-pip git

          # Install FastAPI and Uvicorn
          pip3 install fastapi uvicorn

          # Create FastAPI app
          cat <<EOF > /home/ec2-user/main.py
          from fastapi import FastAPI
          app = FastAPI()
          @app.get("/")
          def read_root():
              return {"message": "Hello from FastAPI on EC2!"}
          EOF

          # Run FastAPI app
          nohup uvicorn main:app --host 0.0.0.0 --port 80 > /home/ec2-user/fastapi.log 2>&1 &

      Tags:
        - Key: Name
          Value: FastAPI-PoC

Outputs:
  EC2PublicIP:
    Description: "Public IP of the FastAPI EC2 instance"
    Value: !GetAtt EC2Instance.PublicIp
